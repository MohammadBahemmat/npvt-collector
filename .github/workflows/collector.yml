name: NPVT Collector

on:
  workflow_dispatch:      # اجرای دستی از تب Actions، هر وقت لازم بود
  schedule:
    # راس هر ساعت (دقیقه‌ی صفر). GitHub Actions طبق مستندات خودش می‌تواند
    # در بازه‌های پرترافیک، اجرای واقعی را تا چند دقیقه به تأخیر بیندازد؛
    # این یک محدودیت پلتفرم است و از طریق تنظیمات این پروژه قابل حذف نیست،
    # اما برای کاربرد این پروژه (اسکن هر ساعته‌ی چند کانال) کاملاً کافی است.
    - cron: '45 */3 * * *'

concurrency:
  group: npvt-collector-run
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r config/requirements.txt

      - name: Run NPVT collector
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TARGET_CHANNEL: ${{ secrets.TARGET_CHANNEL }}
        run: python src/npvt_collector.py

      - name: Commit and push updated state
        timeout-minutes: 30
        continue-on-error: true
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          mkdir -p data
          git add -A data/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "🔄 Update NPVT collector state [skip ci]"
            git pull --rebase --strategy-option ours
            git push
          fi
