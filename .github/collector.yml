name: NPVT Collector

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'   # هر ساعت — در صورت نیاز تغییر دهید

concurrency:
  group: npvt-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r config/requirements.txt

      - name: Run NPVT collector
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TARGET_CHANNEL: ${{ secrets.TARGET_CHANNEL }}
        run: python src/npvt_collector.py

      - name: Commit and push updated state
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          mkdir -p data
          git add data/last_message_id.json data/seen_files.json data/npvt_report.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "🔄 Update NPVT collector state [skip ci]"
            git pull --rebase --strategy-option ours
            git push
          fi
