name: NPVT Collector (auto-chain)

on:
  workflow_dispatch:      # فقط با اجرای دستی شروع می‌شود؛ بعد از آن خودش را دوباره صدا می‌زند

concurrency:
  group: npvt-collector-run
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r config/requirements.txt

      - name: Run NPVT collector
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TARGET_CHANNEL: ${{ secrets.TARGET_CHANNEL }}
        run: python src/npvt_collector.py

      - name: Commit and push updated state
        timeout-minutes: 5
        continue-on-error: true
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          mkdir -p data
          git add -A data/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "🔄 Update NPVT collector state [skip ci]"
            git pull --rebase --strategy-option ours
            git push
          fi

      # ---- بلافاصله پس از پایان این اجرا، اجرای بعدی را صدا می‌زند ----
      # نیازمند Secret به نام GH_TOKEN (یک Personal Access Token با دسترسی
      # repo + workflow)، چون توکن پیش‌فرض GITHUB_TOKEN اجازه‌ی صدا زدن
      # workflow_dispatch را ندارد (محدودیت امنیتی خودِ گیت‌هاب).
      - name: Trigger next run
        if: success()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'collector.yml',
              ref: 'main'
            });
